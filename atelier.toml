root = "nixos"

# Supported systems to evaluate and build for
systems = ["x86_64-linux"]

# Attributes to build
include = [
  "nixosConfigurations.*",
]

# Attributes to exclude from CI builds
# service-vaultwarden is built as a Proxmox LXC image (via image.modules) rather than a standard system toplevel
exclude = [
  "nixosConfigurations.service-vaultwarden",
]

# Extra binary caches to check before building
# An attribute already present in any cache is skipped rather than built
# Note: https://cache.nixos.org is always included and checked by default
substituters = [
  "https://cache.ysun.co",
  "https://hyprland.cachix.org",
  "https://niri.cachix.org",
  "https://cache.numtide.com",
  "https://cache.saumon.network/proxmox-nixos",
]

